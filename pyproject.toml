[project]
name = "saudi-compliance-assistant"
version = "0.1.0"
description = "Bilingual (Arabic/English) RAG assistant for Saudi PDPL and NCA ECC compliance questions, with article-level citations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*", "ingest*", "eval*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=...) adds noise for pairwise iteration

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Postgres/Ollama running"]
