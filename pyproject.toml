[project]
name = "daleel"
version = "0.1.0"
description = "Daleel: a bilingual (Arabic/English) RAG assistant for Saudi PDPL and NCA cybersecurity controls, with article-level citations."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0"]
# only needed to rebuild data/processed from the PDFs (Tesseract with Arabic data must also be installed)
ingest = ["rapidocr-onnxruntime>=1.3", "pillow>=10"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*", "ingest*", "eval*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=...) adds noise for pairwise iteration

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs Postgres/Ollama running",
    "llm: checks answer quality of the default 7B model (run locally, skipped in CI)",
]
