# Source documents for ingestion. PDFs live in data/raw/ (git-ignored); this manifest is committed.
# Each entry was checked by reading the PDF content, not just the file name (2026-11-19).
#
# unit:         article | control   -> which structural chunker to use
# id_position:  for control documents, whether a control ID comes before or after its text in the
#               extracted text stream (ECC/DCC Arabic PDFs emit the ID after the text).
# pages:        optional [first, last] page range (1-based, inclusive)
# ocr:          OCR the file instead of reading its text layer
# authority:    standing of each language version (see docs/decisions/001-arabic-is-binding.md)
#               binding     = the document itself says this version prevails
#               official    = original-language text; the PDFs do not state which version prevails
#               translation = English rendering of the Arabic text
# aliases:      map a ref_key in one language to the canonical (Arabic) ref_key where NCA's two
#               files number the same control differently

documents:
  - doc_id: pdpl
    title: Personal Data Protection Law (amended by Royal Decree M/148, 5/9/1444H)
    short: {en: PDPL, ar: نظام حماية البيانات الشخصية}
    issuer: SDAIA
    authority: {ar: official, en: translation}   # not stated in the SDAIA PDFs
    unit: article
    files:
      en: raw/pdpl/en/pdpl_law_en.pdf        # 16 pages, 43 articles
      ar: raw/pdpl/ar/pdpl_law_ar.pdf        # 16 pages, ordinal article headings (المادة الأولى ...)

  - doc_id: pdpl_ir
    title: Implementing Regulation of the Personal Data Protection Law
    short: {en: PDPL Implementing Regulation, ar: اللائحة التنفيذية لنظام حماية البيانات الشخصية}
    issuer: SDAIA
    authority: {ar: official, en: translation}   # not stated in the SDAIA PDFs
    unit: article
    files:
      en: raw/pdpl_ir/en/pdpl_ir_en.pdf
      ar: raw/pdpl_ir/ar/pdpl_ir_ar.pdf      # 22 pages
    pages:
      # The English file bundles an OLDER Transfer Regulation (10 articles) on pages 33-40.
      # It is superseded by pdpl_transfer v2.0 (Aug 2024), so only pages 1-32 are ingested.
      en: [1, 32]

  - doc_id: pdpl_transfer
    title: Regulation on Personal Data Transfer outside the Kingdom (v2.0, Aug 2024)
    short: {en: Personal Data Transfer Regulation, ar: لائحة نقل البيانات الشخصية إلى خارج المملكة}
    issuer: SDAIA
    authority: {ar: official, en: translation}   # not stated in the SDAIA PDFs
    unit: article
    files:
      en: raw/pdpl_transfer/en/pdpl_transfer_en.pdf   # 11 pages, 9 articles
      ar: raw/pdpl_transfer/ar/pdpl_transfer_ar.pdf   # 9 pages, v2.0 Aug 2024, 9 articles

  - doc_id: ecc
    title: Essential Cybersecurity Controls (ECC-2:2024)
    short: {en: NCA ECC-2:2024, ar: الضوابط الأساسية للأمن السيبراني ECC-2:2024}
    issuer: NCA
    authority: {ar: binding, en: translation}     # stated in the English NCA PDFs
    unit: control
    files:
      en: raw/nca_ecc/en/ecc-2-2024_en.pdf
      ar: raw/nca_ecc/ar/ecc-2-2024_ar.pdf
    id_position: {ar: after}
    # Every other control page in the Arabic file is drawn as graphics (no text layer).
    # Those pages are OCR'd with Tesseract and rows are labelled using the English control order.
    grid_ocr: {ar: true}
    # NCA's Arabic and English ECC-2:2024 files number these controls differently (checked by
    # reading both). NCA states the Arabic version is binding. Attached to the chunks as `note`.
    aliases:
      en: {ctl-1-7-1: ctl-1-7-2, ctl-2-7-3: ctl-2-7-4}
    version_notes:
      ctl-1-7-1:
        en: "The Arabic ECC-2:2024 numbers this control 1-7-2; its Arabic 1-7-1 (comply with national cybersecurity legislation) is listed as deleted in the English version's appendix."
        ar: "هذا الضابط (الالتزام بالمتطلبات التشريعية والتنظيمية الوطنية) غير موجود في النسخة الإنجليزية، التي تذكره ضمن الضوابط المحذوفة."
      ctl-1-7-2:
        ar: "يقابل هذا الضابط الضابط 1-7-1 في النسخة الإنجليزية."
      ctl-2-7-3:
        en: "The Arabic ECC-2:2024 numbers this control 2-7-4; its Arabic 2-7-3 (cover at least the requirements of NCA's Data Cybersecurity Controls) has no English counterpart."
        ar: "هذا الضابط (تغطية متطلبات ضوابط الأمن السيبراني للبيانات كحد أدنى) غير موجود في النسخة الإنجليزية."
      ctl-2-7-4:
        ar: "يقابل هذا الضابط الضابط 2-7-3 في النسخة الإنجليزية."

  - doc_id: ccc
    title: Cloud Cybersecurity Controls (CCC-2:2024)
    short: {en: NCA CCC-2:2024, ar: ضوابط الأمن السيبراني للحوسبة السحابية CCC-2:2024}
    issuer: NCA
    authority: {ar: binding, en: translation}     # stated in the English NCA PDFs
    unit: control
    files:
      en: raw/nca_ccc/en/ccc-2-2024_en.pdf
      ar: raw/nca_ccc/ar/ccc-2-2024_ar.pdf   # control IDs use Arabic-Indic digits and letters (٢-٥-م-١)

  - doc_id: dcc
    title: Data Cybersecurity Controls (DCC-1:2022)
    short: {en: NCA DCC-1:2022, ar: ضوابط الأمن السيبراني للبيانات DCC-1:2022}
    issuer: NCA
    authority: {ar: binding, en: translation}     # stated in the English NCA PDFs
    unit: control
    files:
      en: raw/nca_dcc/en/dcc-1-2022_en.pdf   # control tables are drawn as graphics -> needs OCR
      ar: raw/nca_dcc/ar/dcc-1-2022_ar.pdf
    id_position: {ar: after}
    ocr:
      en: true
